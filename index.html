<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Operation Pacific Shield</title>
    <style>
      :root {
        --bg-deep: #07141d;
        --bg-mid: #0f2435;
        --panel: rgba(11, 26, 35, 0.9);
        --panel-alt: rgba(15, 33, 45, 0.9);
        --panel-soft: rgba(22, 46, 58, 0.88);
        --line: rgba(122, 154, 179, 0.35);
        --line-strong: rgba(170, 210, 255, 0.5);
        --text: #edf7ff;
        --muted: #a9c6d8;
        --cyan: #57d6ff;
        --blue: #6aa7ff;
        --green: #6de3a6;
        --amber: #ffcf70;
        --red: #ff7b7b;
        --violet: #9d8cff;
        --shadow: rgba(0, 0, 0, 0.35);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        background:
          radial-gradient(circle at top, rgba(87, 214, 255, 0.18), transparent 35%),
          linear-gradient(180deg, #07141d 0%, #0a1d26 30%, #091720 100%);
        color: var(--text);
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        min-height: 100vh;
      }

      button, select, input {
        font: inherit;
      }

      .app-shell {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 40;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 1rem 1.2rem;
        background: rgba(7, 20, 29, 0.9);
        border-bottom: 1px solid var(--line);
        backdrop-filter: blur(12px);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 0.9rem;
      }

      .brand-mark {
        width: 2.7rem;
        height: 2.7rem;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, rgba(87,214,255,0.18), rgba(109, 227, 166, 0.24));
        border: 1px solid var(--line-strong);
        box-shadow: 0 0 30px rgba(87,214,255,0.2);
        font-weight: 700;
        color: var(--cyan);
      }

      .brand-copy h1 {
        margin: 0;
        font-size: clamp(1.1rem, 1.7vw, 1.8rem);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .brand-copy small {
        color: var(--muted);
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .topbar-controls {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 0.75rem;
      }

      .control-select,
      .primary-button,
      .secondary-button,
      .ghost-button,
      .tiny-button {
        border-radius: 12px;
        border: 1px solid var(--line);
        background: rgba(19, 41, 52, 0.92);
        color: var(--text);
        min-height: 2.55rem;
        padding: 0.55rem 0.8rem;
        transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
      }

      select.control-select {
        min-width: 10rem;
      }

      .primary-button {
        background: linear-gradient(135deg, rgba(87,214,255,0.18), rgba(100,145,255,0.28));
        border-color: rgba(87,214,255,0.45);
      }

      .secondary-button {
        background: rgba(16, 58, 39, 0.7);
        border-color: rgba(109, 227, 166, 0.45);
      }

      .ghost-button {
        background: rgba(255,255,255,0.03);
      }

      .tiny-button {
        padding: 0.35rem 0.6rem;
        min-height: 2rem;
        font-size: 0.8rem;
      }

      button:hover,
      .action-button:hover,
      .node:hover,
      .asset:hover {
        transform: translateY(-1px);
        border-color: rgba(87,214,255,0.75);
        box-shadow: 0 8px 26px rgba(0, 0, 0, 0.18);
      }

      .game-shell {
        display: grid;
        grid-template-columns: 320px minmax(0, 1fr) 320px;
        gap: 1rem;
        flex: 1;
        padding: 1rem;
      }

      .stack {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      .panel {
        background: linear-gradient(180deg, rgba(12, 25, 33, 0.94), rgba(8, 18, 24, 0.94));
        border: 1px solid var(--line);
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
      }

      .panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.9rem 1rem;
        border-bottom: 1px solid var(--line);
        background: rgba(16, 29, 39, 0.9);
      }

      .panel-header h3 {
        margin: 0;
        font-size: 0.8rem;
        letter-spacing: 0.12em;
        color: var(--muted);
        text-transform: uppercase;
      }

      .panel-body {
        padding: 1rem;
      }

      .mission-summary {
        display: grid;
        gap: 0.7rem;
      }

      .metric-row {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.65rem;
      }

      .metric {
        background: rgba(17, 34, 44, 0.8);
        border: 1px solid rgba(122, 154, 179, 0.24);
        border-radius: 12px;
        padding: 0.7rem 0.75rem;
      }

      .metric-label {
        display: block;
        color: var(--muted);
        font-size: 0.71rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        margin-bottom: 0.2rem;
      }

      .metric-value {
        font-size: 1.15rem;
        font-weight: 700;
      }

      .mission-list {
        display: grid;
        gap: 0.7rem;
      }

      .objective {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.6rem;
        padding: 0.65rem 0.75rem;
        border-radius: 12px;
        border: 1px solid rgba(122, 154, 179, 0.2);
        background: rgba(22, 38, 49, 0.7);
      }

      .objective small {
        color: var(--muted);
      }

      .status-pill {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.2rem 0.55rem;
        border-radius: 999px;
        font-size: 0.7rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-weight: 700;
      }

      .status-pill.ready {
        background: rgba(109, 227, 166, 0.15);
        color: var(--green);
      }

      .status-pill.warning {
        background: rgba(255, 207, 112, 0.12);
        color: var(--amber);
      }

      .status-pill.critical {
        background: rgba(255, 123, 123, 0.12);
        color: var(--red);
      }

      .command-list,
      .log-list,
      .library-list,
      .message-list {
        display: grid;
        gap: 0.7rem;
      }

      .command-item,
      .log-item,
      .library-item,
      .message-item {
        border: 1px solid rgba(122, 154, 179, 0.18);
        border-radius: 12px;
        padding: 0.7rem 0.8rem;
        background: rgba(14, 27, 35, 0.86);
      }

      .command-item strong,
      .library-item strong,
      .message-item strong {
        display: block;
        margin-bottom: 0.15rem;
      }

      .command-item small,
      .library-item small,
      .message-item small {
        color: var(--muted);
      }

      .board-panel {
        display: flex;
        flex-direction: column;
        min-width: 0;
      }

      .board-wrap {
        position: relative;
        border-radius: 22px;
        overflow: hidden;
        background:
          linear-gradient(180deg, rgba(8, 23, 32, 0.65), rgba(8, 25, 34, 0.82)),
          radial-gradient(circle at 40% 15%, rgba(87,214,255,0.1), transparent 30%),
          linear-gradient(135deg, rgba(19, 41, 52, 0.8), rgba(11, 26, 32, 0.95));
        border: 1px solid var(--line-strong);
        height: min(72vh, 860px);
        min-height: 480px;
        box-shadow: inset 0 0 42px rgba(0, 0, 0, 0.18), 0 25px 55px rgba(0,0,0,0.28);
      }

      .board {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        cursor: crosshair;
        background:
          linear-gradient(rgba(96,174,223,0.06) 1px, transparent 1px),
          linear-gradient(90deg, rgba(96,174,223,0.06) 1px, transparent 1px),
          radial-gradient(circle at 50% 30%, rgba(119, 182, 255, 0.12), transparent 42%),
          linear-gradient(180deg, rgba(8, 30, 42, 0.7), rgba(10, 20, 31, 0.92));
        background-size: 44px 44px, 44px 44px, auto, auto;
      }

      .sea-haze {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(circle at 25% 30%, rgba(87,214,255,0.12), transparent 18%),
          radial-gradient(circle at 72% 40%, rgba(97, 100, 255, 0.12), transparent 20%),
          radial-gradient(circle at 45% 75%, rgba(109, 227, 166, 0.12), transparent 18%);
      }

      .board-overlay {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(100deg, transparent 0%, rgba(255,255,255,0.1) 15%, transparent 30%),
          linear-gradient(180deg, transparent 0%, rgba(255,255,255,0.04) 100%);
      }

      .node-layer,
      .asset-layer {
        position: absolute;
        inset: 0;
      }

      .node {
        position: absolute;
        transform: translate(-50%, -50%);
        width: 120px;
        min-height: 65px;
        padding: 0.4rem 0.5rem;
        border-radius: 16px;
        border: 1px solid rgba(122, 154, 179, 0.28);
        background: rgba(11, 27, 37, 0.85);
        color: var(--text);
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        justify-content: center;
        gap: 0.3rem;
        box-shadow: 0 12px 28px rgba(0,0,0,0.25);
        cursor: pointer;
        text-align: left;
      }

      .node.selected {
        border-color: rgba(87,214,255,0.85);
        box-shadow: 0 0 0 1px rgba(87,214,255,0.8), 0 12px 30px rgba(87,214,255,0.18);
      }

      .node.highlight {
        animation: pulse 1.1s ease-in-out infinite alternate;
      }

      .node .node-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        gap: 0.4rem;
      }

      .node .node-name {
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .node .node-type {
        font-size: 0.56rem;
        color: var(--muted);
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .node .node-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.25rem;
        width: 100%;
        color: var(--muted);
        font-size: 0.6rem;
      }

      .node .mini-bar {
        width: 100%;
        height: 8px;
        border-radius: 999px;
        background: rgba(255,255,255,0.06);
        overflow: hidden;
        border: 1px solid rgba(255,255,255,0.07);
      }

      .node .mini-bar > span {
        display: block;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--green), var(--cyan));
      }

      .node.command { border-color: rgba(109, 227, 166, 0.45); }
      .node.mob { border-color: rgba(87, 214, 255, 0.45); }
      .node.fos { border-color: rgba(255, 207, 112, 0.45); }
      .node.medcom { border-color: rgba(157, 140, 255, 0.45); }

      .asset {
        position: absolute;
        transform: translate(-50%, -50%);
        display: flex;
        align-items: center;
        justify-content: center;
        min-width: 42px;
        min-height: 42px;
        border-radius: 14px;
        border: 1px solid rgba(122, 154, 179, 0.36);
        background: rgba(18, 38, 48, 0.9);
        box-shadow: 0 12px 24px rgba(0,0,0,0.25);
        color: var(--text);
        font-size: 1.1rem;
        cursor: pointer;
        transition: left 0.7s ease, top 0.7s ease, transform 0.2s ease, border-color 0.2s ease;
      }

      .asset.selected {
        border-color: rgba(87,214,255,0.9);
        box-shadow: 0 0 0 2px rgba(87,214,255,0.5), 0 14px 32px rgba(87,214,255,0.18);
      }

      .asset.ready { background: rgba(15, 54, 43, 0.8); }
      .asset.warning { background: rgba(54, 42, 17, 0.8); }
      .asset.critical { background: rgba(64, 27, 27, 0.8); }

      .asset small {
        position: absolute;
        bottom: -0.55rem;
        font-size: 0.55rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .board-controls {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        padding: 0.8rem 1rem;
        border-top: 1px solid var(--line);
        background: rgba(10, 27, 35, 0.8);
      }

      .legend {
        display: flex;
        align-items: center;
        gap: 0.7rem;
        flex-wrap: wrap;
        color: var(--muted);
        font-size: 0.75rem;
        letter-spacing: 0.09em;
        text-transform: uppercase;
      }

      .legend-item {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
      }

      .swatch {
        width: 0.9rem;
        height: 0.9rem;
        display: inline-block;
        border-radius: 0.25rem;
      }

      .swatch.command { background: rgba(87,214,255,0.9); }
      .swatch.mob { background: rgba(109, 227, 166, 0.9); }
      .swatch.fos { background: rgba(255, 207, 112, 0.9); }
      .swatch.medcom { background: rgba(157,140,255,0.9); }
      .swatch.threat { background: rgba(255,123,123,0.9); }

      .actions-grid {
        display: grid;
        gap: 0.7rem;
      }

      .action-button {
        width: 100%;
        text-align: left;
        border-radius: 12px;
        border: 1px solid rgba(122, 154, 179, 0.2);
        background: linear-gradient(180deg, rgba(18, 35, 45, 0.9), rgba(11, 25, 30, 0.92));
        color: var(--text);
        padding: 0.75rem 0.8rem;
        display: flex;
        flex-direction: column;
        gap: 0.15rem;
        cursor: pointer;
      }

      .action-button strong {
        letter-spacing: 0.04em;
      }

      .action-button small {
        color: var(--muted);
      }

      .advisor-box {
        display: grid;
        gap: 0.5rem;
      }

      .advisor-box .callout {
        padding: 0.8rem;
        border-radius: 12px;
        background: linear-gradient(135deg, rgba(87,214,255,0.12), rgba(100,145,255,0.1));
        border: 1px solid rgba(87,214,255,0.25);
        color: var(--text);
      }

      .library-item {
        cursor: pointer;
      }

      .library-item.active {
        border-color: rgba(87,214,255,0.7);
        background: rgba(18, 44, 57, 0.9);
      }

      .detail-panel {
        display: grid;
        gap: 0.7rem;
      }

      .detail-panel h4 {
        margin: 0;
        font-size: 1rem;
      }

      .detail-row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
      }

      .tag {
        background: rgba(87,214,255,0.12);
        border: 1px solid rgba(87,214,255,0.22);
        color: var(--cyan);
        border-radius: 999px;
        padding: 0.18rem 0.5rem;
        font-size: 0.7rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .message-box {
        display: flex;
        gap: 0.5rem;
        padding-top: 0.4rem;
      }

      .message-box input {
        flex: 1;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: rgba(11, 25, 35, 0.9);
        color: var(--text);
        padding: 0.7rem 0.75rem;
      }

      .modal {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(1, 7, 10, 0.78);
        backdrop-filter: blur(6px);
        z-index: 100;
      }

      .modal.open {
        display: flex;
      }

      .modal-card {
        width: min(720px, calc(100vw - 2rem));
        border-radius: 20px;
        border: 1px solid var(--line-strong);
        background: linear-gradient(180deg, rgba(10, 27, 36, 0.98), rgba(7, 17, 23, 0.98));
        box-shadow: 0 35px 80px rgba(0,0,0,0.35);
      }

      .modal-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 1rem 1.2rem;
        border-bottom: 1px solid var(--line);
      }

      .modal-body {
        padding: 1.1rem 1.2rem 1.3rem;
        display: grid;
        gap: 0.9rem;
      }

      .score-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 0.7rem;
      }

      .score-box {
        border-radius: 12px;
        border: 1px solid rgba(122, 154, 179, 0.24);
        background: rgba(15, 29, 37, 0.9);
        padding: 0.8rem;
      }

      .score-box small {
        display: block;
        color: var(--muted);
        margin-bottom: 0.25rem;
      }

      .score-box strong {
        font-size: 1.1rem;
      }

      .bar {
        position: relative;
        height: 10px;
        border-radius: 999px;
        overflow: hidden;
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.08);
      }

      .bar > span {
        display: block;
        height: 100%;
        width: 0;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--green), var(--cyan));
      }

      .hidden { display: none !important; }

      @keyframes pulse {
        from { box-shadow: 0 0 0 0 rgba(87,214,255,0.5); }
        to { box-shadow: 0 0 0 10px rgba(87,214,255,0); }
      }

      @media (max-width: 1100px) {
        .game-shell {
          grid-template-columns: 1fr;
        }

        .board-wrap {
          height: 62vh;
        }
      }

      @media (max-width: 640px) {
        .topbar {
          flex-direction: column;
          align-items: flex-start;
        }

        .topbar-controls {
          width: 100%;
        }

        .metric-row,
        .score-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark">OPS</div>
          <div class="brand-copy">
            <h1>Operation Pacific Shield</h1>
            <small>Pacific Theater Command Simulator</small>
          </div>
        </div>

        <div class="topbar-controls">
          <select id="difficultySelect" class="control-select" aria-label="Select difficulty">
            <option value="beginner">Beginner</option>
            <option value="intermediate" selected>Intermediate</option>
            <option value="advanced">Advanced</option>
          </select>
          <button id="startMissionBtn" class="primary-button">Start Mission</button>
          <button id="pauseBtn" class="secondary-button">Pause</button>
          <button id="saveBtn" class="ghost-button">Save</button>
          <button id="muteBtn" class="ghost-button">Sound On</button>
        </div>
      </header>

      <main class="game-shell">
        <aside class="stack">
          <section class="panel">
            <div class="panel-header">
              <h3>Mission Commander</h3>
              <span class="status-pill ready" id="statusPill">Ready</span>
            </div>
            <div class="panel-body mission-summary" id="missionSummary"></div>
          </section>

          <section class="panel">
            <div class="panel-header">
              <h3>Command Boards</h3>
            </div>
            <div class="panel-body">
              <div id="commandList" class="command-list"></div>
            </div>
          </section>
        </aside>

        <section class="board-panel">
          <div class="board-wrap">
            <div id="gameBoard" class="board" aria-label="Pacific map board">
              <div class="sea-haze"></div>
              <div class="board-overlay"></div>
              <div id="nodeLayer" class="node-layer"></div>
              <div id="assetLayer" class="asset-layer"></div>
            </div>
          </div>

          <div class="board-controls">
            <div class="legend">
              <span class="legend-item"><span class="swatch command"></span> CAOC</span>
              <span class="legend-item"><span class="swatch mob"></span> MOB</span>
              <span class="legend-item"><span class="swatch fos"></span> FOS</span>
              <span class="legend-item"><span class="swatch medcom"></span> MEDCOM</span>
              <span class="legend-item"><span class="swatch threat"></span> Threat</span>
            </div>
            <div class="topbar-controls">
              <button id="ops101Btn" class="tiny-button">OPS 101</button>
              <button id="multiplayerBtn" class="tiny-button">Multiplayer Setup</button>
            </div>
          </div>
        </section>

        <aside class="stack">
          <section class="panel">
            <div class="panel-header">
              <h3>Operational Actions</h3>
            </div>
            <div class="panel-body">
              <div id="actionsGrid" class="actions-grid"></div>
            </div>
          </section>

          <section class="panel">
            <div class="panel-header">
              <h3>Mission Advisor</h3>
            </div>
            <div class="panel-body advisor-box">
              <div id="advisorCallout" class="callout"></div>
            </div>
          </section>

          <section class="panel">
            <div class="panel-header">
              <h3>Asset Library</h3>
            </div>
            <div class="panel-body">
              <div id="assetLibrary" class="library-list"></div>
            </div>
          </section>
        </aside>
      </main>
    </div>

    <div id="modal" class="modal" aria-live="polite">
      <div class="modal-card">
        <div class="modal-head">
          <h2 id="modalTitle">Mission Status</h2>
          <button id="modalCloseBtn" class="ghost-button">Close</button>
        </div>
        <div id="modalBody" class="modal-body"></div>
      </div>
    </div>

    <script>
      const STORAGE_KEY = 'ops_pacific_shield_save_v1';

      const INITIAL_LOCATIONS = [
        { id: 'caoc', name: 'CAOC', type: 'command', x: 38, y: 30, security: 82, readiness: 91, fuel: 40, food: 26, water: 22, personnel: 20, status: 'ready', notes: 'Air operations and battle rhythm.' },
        { id: 'cspoc', name: 'CSPOC', type: 'command', x: 60, y: 26, security: 78, readiness: 88, fuel: 30, food: 18, water: 15, personnel: 14, status: 'ready', notes: 'Space and ISR support.' },

      const TUTORIAL_STEPS = [
        { title: 'OPS 101 - Mission Brief', text: 'Welcome to Operation Pacific Shield. Your first job is to understand the theater. Select the forward operating site labeled FOS Alpha to begin.', target: 'fos-alpha', advice: 'Click FOS Alpha to inspect the site and see its readiness and resource posture.' },
        { title: 'Assign Personnel', text: 'Personnel are the foundation of every command site. Assign them to a location before resupplying or launching aircraft.', target: 'fos-alpha', advice: 'Use the Assign Personnel action on the selected site to build a stronger operating posture.' },
        { title: 'Build Airfield Support', text: 'An airfield gives aircraft a secure place to land, refuel, and sustain missions. Build support before launch.', target: 'fos-alpha', advice: 'Select the forward site and choose Establish Airfield to increase readiness.' },
        { title: 'Move Airlift', text: 'After a site is prepared, move airlift assets to deliver supplies. Click the C-130J asset and then click a target location.', target: 'c130-1', advice: 'Select the C-130J and then click a destination such as FOS Bravo to move cargo.' },
        { title: 'Mission Execution', text: 'Turn-based operations require constant sustainment and awareness of enemy activity. Advance the turn to simulate a new operational cycle.', target: 'gameBoard', advice: 'Use Advance Turn after you complete a sustainment action to trigger the next cycle.' }
      ];

      const DIFFICULTY = {
        beginner: { label: 'Beginner', enemyBias: 1.1, recovery: 1.3, alert: 26, reward: 1.05 },
        intermediate: { label: 'Intermediate', enemyBias: 1.4, recovery: 1.0, alert: 34, reward: 1.2 },
        advanced: { label: 'Advanced', enemyBias: 1.8, recovery: 0.82, alert: 46, reward: 1.35 }
      };

      function buildInitialState() {
        return {
          started: false,
          paused: false,
          difficulty: 'intermediate',
          volumeOn: true,
          turn: 1,
          score: 0,
          threat: 28,
          alertLevel: 0,
          missionStatus: 'Planning',
          selectedNodeId: 'moba-koa',
          selectedAssetId: 'c130-1',
          nodes: JSON.parse(JSON.stringify(INITIAL_LOCATIONS)),
          assets: JSON.parse(JSON.stringify(INITIAL_ASSETS)),
          resources: {
            fuel: 68,
            food: 58,
            water: 52,
            munitions: 44,
            personnel: 86,
            medical: 36,
            comms: 60
          },
          missionObjectives: [
            { id: 'secure', label: 'Secure forward logistics route', done: false },
            { id: 'sustain', label: 'Sustain airlift and base readiness', done: false },
            { id: 'medevac', label: 'Maintain medical and communications coverage', done: false },
            { id: 'complete', label: 'Complete air and space support mission', done: false }
          ],
          logs: [
            'PACIFIC SHIELD mission initialized. Command boards are online and ready for planning.',
            'Assess the airfield and logistics network before the next operational cycle.'
          ],
          messages: [
            { author: 'Ops Lead', text: 'Opening cadence complete. Forward operating sites are reporting on station.' },
            { author: 'CSPOC', text: 'ISR and communications remain stable. Continue to monitor mission routes.' }
          ],
          tutorialStep: 0,
          tutorialOpen: false,
          lastAdvisor: 'The theater is stable. Begin by preparing FOS Alpha and Koa to support airlift.'
        };
      }

      let state = loadState() || buildInitialState();

      function clamp(value, min, max) {
        return Math.min(Math.max(value, min), max);
      }

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          return raw ? JSON.parse(raw) : null;
        } catch (err) {
          return null;
        }
      }

      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
          addLog('Session saved to browser storage.');
        } catch (err) {
          addLog('Could not save this session in browser storage.');
        }
      }

      function getNode(id) {
        return state.nodes.find((node) => node.id === id);
      }

      function getAsset(id) {
        return state.assets.find((asset) => asset.id === id);
      }

      function getDifficultyProfile() {
        return DIFFICULTY[state.difficulty] || DIFFICULTY.intermediate;
      }

      function addLog(message) {
        state.logs.unshift(message);
        state.logs = state.logs.slice(0, 12);
      }

      function addMessage(author, text) {
        state.messages.push({ author, text });
        state.messages = state.messages.slice(-6);
      }

      function playTone(type = 'success') {
        if (!state.volumeOn) return;
        try {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return;
          const ctx = new AudioCtx();
          const oscillator = ctx.createOscillator();
          const gain = ctx.createGain();
          oscillator.type = type === 'alert' ? 'sawtooth' : 'triangle';
          oscillator.frequency.value = type === 'alert' ? 180 : 620;
          gain.gain.value = 0.03;
          oscillator.connect(gain);
          gain.connect(ctx.destination);
          oscillator.start();
          oscillator.stop(ctx.currentTime + 0.08);
        } catch (err) {
          // Ignore browser audio restrictions.
        }
      }

      function setDifficulty(value) {
        state.difficulty = value;
        addLog(`${DIFFICULTY[value].label} difficulty selected. Enemy reactions increased.`);
        renderAll();
      }

      function updateMissionStatus() {
        const readiness = state.nodes.reduce((sum, node) => sum + node.readiness, 0) / state.nodes.length;
        const sustain = state.nodes.filter((node) => node.readiness > 65).length;
        const secureForward = state.nodes.filter((node) => node.type === 'fos' && node.readiness > 60).length >= 2;
        const airfieldReady = state.nodes.filter((node) => node.type === 'fos' && node.readiness > 68).length >= 1;

        if (!state.started) {
          state.missionStatus = 'Planning';
          return;
        }

        if (state.turn >= 8 && secureForward && airfieldReady && readiness > 68 && sustain >= 4) {
          state.missionStatus = 'Mission complete';
          finalizeMission(true);
          return;
        }

        if (state.threat > 72 || state.resources.fuel < 8 || readiness < 46) {
          state.missionStatus = 'Critical';
        } else if (secureForward && airfieldReady) {
          state.missionStatus = 'Operational';
        } else {
          state.missionStatus = 'Advancing';
        }
      }

      function finalizeMission(success) {
        if (state.completed) return;
        state.completed = true;

        const readinessAvg = state.nodes.reduce((sum, node) => sum + node.readiness, 0) / state.nodes.length;
        const operationalScore = Math.round((state.score + readinessAvg * 2 + state.resources.personnel * 0.8 + state.turn * 10) * getDifficultyProfile().reward);
        const summary = success
          ? {
              title: 'Mission Success',
              text: 'Pacific Shield achieved sustained logistics and force protection across the forward theater.',
              score: operationalScore,
              rating: operationalScore > 650 ? 'Excellent' : 'Successful'
            }
          : {
              title: 'Mission Adjusted',
              text: 'The mission was sustained but the theater was pressured by enemy activity and resource constraints.',
              score: Math.max(120, operationalScore - 120),
              rating: 'Needs Improvement'
            };

        openModal(summary.title, `
          <p>${summary.text}</p>
          <div class="score-grid">
            <div class="score-box"><small>Mission Score</small><strong>${summary.score}</strong></div>
            <div class="score-box"><small>Turn</small><strong>${state.turn}</strong></div>
            <div class="score-box"><small>Rating</small><strong>${summary.rating}</strong></div>
          </div>
          <div class="detail-panel">
            <div>
              <h4>Operational Review</h4>
              <div class="detail-row">
                <span class="tag">Threat ${state.threat}%</span>
                <span class="tag">Readiness ${Math.round(readinessAvg)}%</span>
                <span class="tag">Fuel ${state.resources.fuel}</span>
              </div>
            </div>
            <p>Continue building the theater by keeping FOS sites supplied, airlift available, and comms resilient.</p>
          </div>
        `);
      }

      function updateObjectives() {
        const forwardReady = state.nodes.filter((node) => node.type === 'fos' && node.readiness > 60).length >= 2;
        const logistics = state.resources.fuel >= 20 && state.resources.food >= 20 && state.resources.water >= 20;
        const med = state.nodes.some((node) => node.type === 'medcom' && node.readiness > 70);
        const air = state.assets.some((asset) => asset.type === 'airlift' && asset.readiness > 75);

        state.missionObjectives = [
          { id: 'secure', label: 'Secure forward logistics route', done: forwardReady },
          { id: 'sustain', label: 'Sustain airlift and base readiness', done: logistics && air },
          { id: 'medevac', label: 'Maintain medical and communications coverage', done: med },
          { id: 'complete', label: 'Complete air and space support mission', done: false }
        ];
      }

      function renderMissionSummary() {
        const readinessAvg = Math.round(state.nodes.reduce((sum, node) => sum + node.readiness, 0) / state.nodes.length);
        const container = document.getElementById('missionSummary');

        container.innerHTML = `
          <div class="metric-row">
            <div class="metric">
              <span class="metric-label">Turn</span>
              <span class="metric-value">${state.turn}</span>
            </div>
            <div class="metric">
              <span class="metric-label">Score</span>
              <span class="metric-value">${state.score}</span>
            </div>
          </div>
          <div class="metric-row">
            <div class="metric">
              <span class="metric-label">Threat</span>
              <span class="metric-value">${state.threat}%</span>
            </div>
            <div class="metric">
              <span class="metric-label">Readiness</span>
              <span class="metric-value">${readinessAvg}%</span>
            </div>
          </div>
          <div class="mission-list">
            ${state.missionObjectives.map(objective => `
              <div class="objective">
                <div>
                  <strong>${objective.label}</strong>
                </div>
                <span class="status-pill ${objective.done ? 'ready' : 'warning'}">${objective.done ? 'Complete' : 'In Progress'}</span>
              </div>
            `).join('')}
          </div>
        `;

        const pill = document.getElementById('statusPill');
        const title = state.started ? state.missionStatus : 'Ready';
        pill.textContent = title;
        pill.className = `status-pill ${state.threat > 60 ? 'critical' : state.missionStatus === 'Operational' ? 'ready' : 'warning'}`;
      }

      function renderCommandList() {
        const list = document.getElementById('commandList');
        list.innerHTML = state.nodes.map((node) => `
          <div class="command-item" data-node-id="${node.id}">
            <strong>${node.name}</strong>
            <small>${node.type.toUpperCase()} • Readiness ${node.readiness}% • ${node.status}</small>
          </div>
        `).join('');

        list.querySelectorAll('[data-node-id]').forEach((item) => {
          item.addEventListener('click', () => selectNode(item.dataset.nodeId));
        });
      }

      function renderActions() {
        const grid = document.getElementById('actionsGrid');
        const actions = [
          { key: 'assignPersonnel', label: 'Assign Personnel', hint: 'Add people to selected site' },
          { key: 'establishAirfield', label: 'Establish Airfield', hint: 'Build runway and support' },
          { key: 'resupplyBase', label: 'Resupply Site', hint: 'Deliver food, fuel, and water' },
          { key: 'requestRFI', label: 'Request RFI / Status', hint: 'Gather confirmation and reduce confusion' },
          { key: 'launchAirlift', label: 'Launch Airlift', hint: 'Move selected aircraft to a destination' },
          { key: 'engageThreat', label: 'Engage Threat', hint: 'Improve local security' },
          { key: 'advanceTurn', label: 'Advance Turn', hint: 'Move to next operational cycle' }
        ];

        grid.innerHTML = actions.map((action) => `
          <button class="action-button" data-action="${action.key}">
            <strong>${action.label}</strong>
            <small>${action.hint}</small>
          </button>
        `).join('');

        grid.querySelectorAll('[data-action]').forEach((button) => {
          button.addEventListener('click', () => {
            const fn = button.dataset.action;
            if (typeof window[fn] === 'function') {
              window[fn]();
            }
          });
        });
      }

      function renderAssetLibrary() {
        const library = document.getElementById('assetLibrary');
        library.innerHTML = ASSET_LIBRARY.map((asset) => `
          <div class="library-item ${asset.id === 'airlift' ? 'active' : ''}" data-library-id="${asset.id}">
            <strong>${asset.icon} ${asset.name}</strong>
            <small>${asset.command} • ${asset.resources}</small>
          </div>
        `).join('');

        library.querySelectorAll('[data-library-id]').forEach((item) => {
          item.addEventListener('click', () => {
            const info = ASSET_LIBRARY.find((entry) => entry.id === item.dataset.libraryId);
            const panel = document.getElementById('assetLibraryDetail');
            if (!panel) {
              const wrapper = document.createElement('div');
              wrapper.className = 'detail-panel';
              wrapper.id = 'assetLibraryDetail';
              wrapper.innerHTML = `
                <h4>${info.name}</h4>
                <div class="detail-row">
                  <span class="tag">${info.abbreviation}</span>
                  <span class="tag">${info.command}</span>
                </div>

                <p><strong>When to use:</strong> ${info.example}</p>
                <p><strong>What happens if it's missing:</strong> ${info.risk}</p>
                <p><strong>Easy memory:</strong> ${info.memory}</p>
              `;
              library.appendChild(wrapper);
            } else {
              panel.innerHTML = `
                <h4>${info.name}</h4>
                <div class="detail-row">
                  <span class="tag">${info.abbreviation}</span>
                  <span class="tag">${info.command}</span>
                </div>
                <p>${info.use}</p>
                <p><strong>When to use:</strong> ${info.example}</p>
                <p><strong>What happens if it's missing:</strong> ${info.risk}</p>
                <p><strong>Easy memory:</strong> ${info.memory}</p>
              `;
            }
          });
        });
      }

      function renderAdvisor() {
        const callout = document.getElementById('advisorCallout');
        callout.innerHTML = `
          <strong>Mission advisor</strong>
          <p>${state.lastAdvisor}</p>
          <div class="detail-row">
            <span class="tag">Difficulty ${DIFFICULTY[state.difficulty].label}</span>
            <span class="tag">Threat ${state.threat}%</span>
          </div>
        `;
      }

      function renderBoard() {
        const nodeLayer = document.getElementById('nodeLayer');
        const assetLayer = document.getElementById('assetLayer');

        nodeLayer.innerHTML = state.nodes.map((node) => `
          <button class="node ${node.type} ${state.selectedNodeId === node.id ? 'selected' : ''} ${node.id === (TUTORIAL_STEPS[state.tutorialStep]?.target || '') ? 'highlight' : ''}" data-node-id="${node.id}" style="left:${node.x}%; top:${node.y}%">
            <div class="node-head">
              <span class="node-name">${node.name}</span>
              <span class="status-pill ${node.readiness > 70 ? 'ready' : node.readiness > 45 ? 'warning' : 'critical'}">${node.status}</span>
            </div>
            <div class="node-type">${node.type}</div>
            <div class="node-meta">
              <span>Rdy ${node.readiness}%</span>
              <span>Sec ${node.security}%</span>
            </div>
            <div class="mini-bar"><span style="width:${node.readiness}%"></span></div>
          </button>
        `).join('');

        assetLayer.innerHTML = state.assets.map((asset) => {
          const currentNode = getNode(asset.current);
          return `
            <button class="asset ${state.selectedAssetId === asset.id ? 'selected' : ''} ${asset.readiness > 75 ? 'ready' : asset.readiness > 50 ? 'warning' : 'critical'}" data-asset-id="${asset.id}" style="left:${currentNode ? currentNode.x : 50}%; top:${currentNode ? currentNode.y : 50}%">
              <span>${asset.icon}</span>
              <small>${asset.name.split(' ')[0]}</small>
            </button>
          `;
        }).join('');

        nodeLayer.querySelectorAll('.node').forEach((nodeEl) => {
          nodeEl.addEventListener('click', (event) => {
            event.stopPropagation();
            selectNode(nodeEl.dataset.nodeId);
          });
        });

        assetLayer.querySelectorAll('.asset').forEach((assetEl) => {
          assetEl.addEventListener('click', (event) => {
            event.stopPropagation();
            const assetId = assetEl.dataset.assetId;
            state.selectedAssetId = assetId;
            const asset = getAsset(assetId);
            state.lastAdvisor = `${asset.name} is on station at ${getNode(asset.current)?.name}. ${asset.description}. Choose a destination or assign support.`;
            renderAll();
          });
        });
      }

      function renderAll() {
        updateObjectives();
        updateMissionStatus();
        renderMissionSummary();
        renderCommandList();
        renderActions();
        renderAssetLibrary();
        renderAdvisor();
        renderBoard();
      }

      function selectNode(nodeId) {
        const node = getNode(nodeId);
        if (!node) return;
        state.selectedNodeId = nodeId;
        if (state.selectedAssetId) {
          const asset = getAsset(state.selectedAssetId);
          if (asset && asset.type === 'airlift') {
            state.lastAdvisor = `Selected ${node.name}. ${node.notes} Use the airlift asset to deliver sustainment or move personnel to the site.`;
          } else {
            state.lastAdvisor = `${node.name} selected. Review readiness, security, and resource posture before issuing actions.`;
          }
        }
        renderAll();
      }

      function assignPersonnel() {
        const node = getNode(state.selectedNodeId);
        if (!node) return;
        if (state.resources.personnel < 5) {
          state.lastAdvisor = 'Personnel are critically low. Reallocate available staff or hold the current posture until the next cycle.';
          renderAll();
          return;
        }
        node.personnel += 8;
        node.security = clamp(node.security + 6, 0, 100);
        node.readiness = clamp(node.readiness + 5, 0, 100);
        state.resources.personnel = clamp(state.resources.personnel - 5, 0, 1000);
        state.score += 12;
        state.lastAdvisor = `${node.name} has received reinforcing personnel. Security and readiness are trending upward.`;
        addLog(`${node.name} personnel assigned. Security improved.`);
        playTone('success');
        renderAll();
      }

      function establishAirfield() {
        const node = getNode(state.selectedNodeId);
        if (!node) return;
        if (state.resources.fuel < 12 || state.resources.personnel < 8) {
          state.lastAdvisor = 'Airfield support requires fuel and personnel. Reallocate resources before using the airfield action.';
          renderAll();
          return;
        }
        node.airfield = clamp((node.airfield || 0) + 35, 0, 100);
        node.readiness = clamp(node.readiness + 12, 0, 100);
        node.security = clamp(node.security + 4, 0, 100);
        state.resources.fuel = clamp(state.resources.fuel - 12, 0, 500);
        state.resources.personnel = clamp(state.resources.personnel - 8, 0, 500);
        state.score += 18;
        state.lastAdvisor = `Airfield support established at ${node.name}. Aircraft can now land and sustain operations more effectively.`;
        addLog(`Airfield support established at ${node.name}.`);
        playTone('success');
        renderAll();
      }

      function resupplyBase() {
        const node = getNode(state.selectedNodeId);
        if (!node) return;
        const costs = { fuel: 10, food: 8, water: 8, munitions: 4 };
        if (state.resources.fuel < costs.fuel) {
          state.lastAdvisor = 'The resource pipeline is too thin to resupply this site. Consider a smaller sustainment action or use a different base.';
          renderAll();
          return;
        }
        node.fuel = clamp(node.fuel + 18, 0, 100);
        node.food = clamp(node.food + 16, 0, 100);
        node.water = clamp(node.water + 16, 0, 100);
        node.readiness = clamp(node.readiness + 7, 0, 100);
        state.resources.fuel = clamp(state.resources.fuel - 10, 0, 500);
        state.resources.food = clamp(state.resources.food - 8, 0, 500);
        state.resources.water = clamp(state.resources.water - 8, 0, 500);
        state.score += 15;
        state.lastAdvisor = `${node.name} has been resupplied. Sustainment posture improved across fuel, food, and water.`;
        addLog(`${node.name} resupplied with essentials.`);
        playTone('success');
        renderAll();
      }

      function requestRFI() {
        const node = getNode(state.selectedNodeId);
        if (!node) return;
        node.status = 'informed';
        node.security = clamp(node.security + 5, 0, 100);
        state.threat = clamp(state.threat - 4, 0, 100);
        state.score += 10;
        state.lastAdvisor = `RFI submitted for ${node.name}. Commanders now have a clearer picture of the operating environment.`;
        addLog(`RFI reviewed for ${node.name}. Threat perception reduced.`);
        playTone();
        renderAll();
      }

      function launchAirlift() {
        const asset = getAsset(state.selectedAssetId);
        if (!asset) return;
        if (asset.type !== 'airlift') {
          state.lastAdvisor = 'Select a C-130J or other airlift asset to launch sustainment and repositioning.';
          renderAll();
          return;
        }
        const targetNode = getNode(state.selectedNodeId);
        const sourceNode = getNode(asset.current);
        if (!targetNode || !sourceNode) return;
        if (state.resources.fuel < 8) {
          state.lastAdvisor = 'Airlift cannot launch without adequate fuel reserves. Rebuild sustainment first.';
          renderAll();
          return;
        }
        asset.current = targetNode.id;
        asset.readiness = clamp(asset.readiness - 5, 0, 100);
        targetNode.fuel = clamp(targetNode.fuel + 12, 0, 100);
        targetNode.food = clamp(targetNode.food + 10, 0, 100);
        state.resources.fuel = clamp(state.resources.fuel - 8, 0, 500);
        state.score += 22;
        state.lastAdvisor = `${asset.name} moved from ${sourceNode.name} to ${targetNode.name}. Sustainment and lift capacity are now in place.`;
        addLog(`Airlift launched: ${asset.name} delivered support to ${targetNode.name}.`);
        playTone('success');
        renderAll();
      }

      function engageThreat() {
        const node = getNode(state.selectedNodeId);
        if (!node) return;
        const effect = 14 + Math.round(getDifficultyProfile().enemyBias * 4);
        node.security = clamp(node.security + effect, 0, 100);
        node.readiness = clamp(node.readiness + 8, 0, 100);
        state.threat = clamp(state.threat - 8, 0, 100);
        state.score += 18;
        state.lastAdvisor = `${node.name} threat posture improved. Enemy pressure was reduced and local security restored.`;
        addLog(`Threat engagement at ${node.name} successful.`);
        playTone('success');
        renderAll();
      }

      function advanceTurn() {
        state.started = true;
        state.turn += 1;
        const profile = getDifficultyProfile();
        const enemyTargets = state.nodes.filter((node) => node.type !== 'command');
        const target = enemyTargets[Math.floor(Math.random() * enemyTargets.length)];
        target.readiness = clamp(target.readiness - Math.round(7 * profile.enemyBias), 0, 100);
        target.security = clamp(target.security - Math.round(9 * profile.enemyBias), 0, 100);
        state.threat = clamp(state.threat + Math.round(5 + profile.alert / 5), 0, 100);
        state.resources.fuel = clamp(state.resources.fuel - 3, 0, 500);
        state.resources.food = clamp(state.resources.food - 2, 0, 500);
        state.resources.water = clamp(state.resources.water - 2, 0, 500);
        state.alertLevel = state.threat;
        state.score += 12;

        if (state.threat > 80) {
          addLog(`Enemy activity increased against ${target.name}. Maintain posture and respond quickly.`);
          state.lastAdvisor = `Enemy activity increased across the theater. Prioritize supply and security at ${target.name} before the next wave.`;
          playTone('alert');
        } else {
          addLog(`Operational window holds. Continue to sustain and coordinate the command network.`);
          state.lastAdvisor = 'The operating picture remains manageable. Continue to build sustainment and improve readiness at forward sites.';
        }

        renderAll();
        updateMissionStatus();
        if (state.missionStatus === 'Mission complete') {
          return;
        }
      }

      function openModal(title, content) {
        const modal = document.getElementById('modal');
        const modalTitle = document.getElementById('modalTitle');
        const modalBody = document.getElementById('modalBody');
        modalTitle.textContent = title;
        modalBody.innerHTML = content;
        modal.classList.add('open');
      }

      function closeModal() {
        document.getElementById('modal').classList.remove('open');
      }

      function showOps101() {
        state.tutorialOpen = true;
        state.tutorialStep = 0;
        openModal('OPS 101 — Learn Before You Command', `
          <div class="detail-panel">
            <h4>${TUTORIAL_STEPS[0].title}</h4>
            <p>${TUTORIAL_STEPS[0].text}</p>
            <div class="detail-row">
              <span class="tag">Step 1 of ${TUTORIAL_STEPS.length}</span>
            </div>
            <div class="message-box">
              <button id="tutorialPrevBtn" class="ghost-button">Previous</button>
              <button id="tutorialNextBtn" class="primary-button">Next</button>
            </div>
          </div>
        `);
        bindTutorialButtons();
      }

      function bindTutorialButtons() {
        const nextBtn = document.getElementById('tutorialNextBtn');
        const prevBtn = document.getElementById('tutorialPrevBtn');
        nextBtn.addEventListener('click', () => {
          const step = TUTORIAL_STEPS[state.tutorialStep + 1];
          if (!step) {
            closeModal();
            state.tutorialOpen = false;
            return;
          }
          state.tutorialStep += 1;
          const modal = document.getElementById('modalBody');
          const current = TUTORIAL_STEPS[state.tutorialStep];
          modal.innerHTML = `
            <div class="detail-panel">
              <h4>${current.title}</h4>
              <p>${current.text}</p>
              <p><strong>Mission advisor:</strong> ${current.advice}</p>
              <div class="detail-row">
                <span class="tag">Step ${state.tutorialStep + 1} of ${TUTORIAL_STEPS.length}</span>
              </div>
              <div class="message-box">
                <button id="tutorialPrevBtn" class="ghost-button">Previous</button>
                <button id="tutorialNextBtn" class="primary-button">${state.tutorialStep < TUTORIAL_STEPS.length - 1 ? 'Next' : 'Finish'}</button>
              </div>
            </div>
          `;
          bindTutorialButtons();
          if (current.target) {
            const target = document.querySelector(`[data-node-id="${current.target}"]`) || document.querySelector(`[data-asset-id="${current.target}"]`);
            if (target) {
              target.classList.add('highlight');
              setTimeout(() => target.classList.remove('highlight'), 2200);
            }
          }
          const speech = new SpeechSynthesisUtterance(current.text);
          window.speechSynthesis?.cancel();
          window.speechSynthesis?.speak(speech);
        });

        if (prevBtn) {
          prevBtn.addEventListener('click', () => {
            if (state.tutorialStep === 0) return;
            state.tutorialStep -= 1;
            const current = TUTORIAL_STEPS[state.tutorialStep];
            const modal = document.getElementById('modalBody');
            modal.innerHTML = `
              <div class="detail-panel">
                <h4>${current.title}</h4>
                <p>${current.text}</p>
                <p><strong>Mission advisor:</strong> ${current.advice}</p>
                <div class="detail-row">
                  <span class="tag">Step ${state.tutorialStep + 1} of ${TUTORIAL_STEPS.length}</span>
                </div>
                <div class="message-box">
                  <button id="tutorialPrevBtn" class="ghost-button">Previous</button>
                  <button id="tutorialNextBtn" class="primary-button">${state.tutorialStep < TUTORIAL_STEPS.length - 1 ? 'Next' : 'Finish'}</button>
                </div>
              </div>
            `;
            bindTutorialButtons();
          });
        }
      }

      function setupTeamMessage() {
        const input = document.getElementById('teamMessageInput');
        if (!input) return;
        const value = input.value.trim();
        if (!value) return;
        addMessage('You', value);
        input.value = '';
        const messages = document.getElementById('teamMessages');
        if (messages) {
          messages.innerHTML = state.messages.map((entry) => `
            <div class="message-item">
              <strong>${entry.author}</strong>
              <small>${entry.text}</small>
            </div>
          `).join('');
        }
      }

      function renderMultiplayerPanel() {
        const html = `
          <div class="detail-panel">
            <h4>Private Room Setup</h4>
            <p>Use Firebase or a similar backend to enable true multiplayer support. GitHub Pages alone cannot host live synchronized game state across devices.</p>
            <div class="detail-row">
              <span class="tag">Room Code: OPS-42</span>
              <span class="tag">Role: Mission Commander</span>
            </div>
            <pre style="white-space: pre-wrap; background: rgba(11,25,35,0.9); border: 1px solid rgba(122,154,179,0.18); border-radius: 12px; padding: 0.75rem; color: var(--text); font-size: 0.76rem; overflow:auto;">const firebaseConfig = {
  apiKey: 'YOUR_API_KEY',
  authDomain: 'your-project.firebaseapp.com',
  databaseURL: 'https://your-project-default-rtdb.firebaseio.com',
  projectId: 'your-project',
  storageBucket: 'your-project.appspot.com',
  messagingSenderId: '1234567890',
  appId: '1:1234567890:web:abc123'
};

// Realtime Database rules example:
{
  "rules": {
    ".read": "auth != null",
    ".write": "auth != null"
  }
}</pre>
            <div class="message-box">
              <input id="teamMessageInput" type="text" placeholder="Send team update..." />
              <button id="sendMessageBtn" class="primary-button">Send</button>
            </div>
            <div id="teamMessages" class="message-list">
              ${state.messages.map((entry) => `
                <div class="message-item">
                  <strong>${entry.author}</strong>
                  <small>${entry.text}</small>
                </div>
              `).join('')}
            </div>
          </div>
        `;
        openModal('Multiplayer Setup', html);

        document.getElementById('sendMessageBtn')?.addEventListener('click', () => {
          setupTeamMessage();
          const messages = document.getElementById('teamMessages');
          messages.innerHTML = state.messages.map((entry) => `
            <div class="message-item">
              <strong>${entry.author}</strong>
              <small>${entry.text}</small>
            </div>
          `).join('');
        });
      }

      function startMission() {
        state.started = true;
        state.missionStatus = 'Operational';
        state.lastAdvisor = 'Mission is active. Lock in your sustainment plan before the next enemy pressure spike.';
        addLog('Operation Pacific Shield started. Mission cycle active.');
        playTone('success');
        renderAll();
      }

      function togglePause() {
        state.paused = !state.paused;
        const pauseBtn = document.getElementById('pauseBtn');
        pauseBtn.textContent = state.paused ? 'Resume' : 'Pause';
        state.lastAdvisor = state.paused ? 'Operations paused. Review the board and mission posture before resuming.' : 'Operations resumed. Continue the mission cadence.';
      }

      function toggleMute() {
        state.volumeOn = !state.volumeOn;
        const btn = document.getElementById('muteBtn');
        btn.textContent = state.volumeOn ? 'Sound On' : 'Sound Off';
      }

      document.getElementById('difficultySelect').addEventListener('change', (event) => setDifficulty(event.target.value));
      document.getElementById('startMissionBtn').addEventListener('click', startMission);
      document.getElementById('pauseBtn').addEventListener('click', togglePause);
      document.getElementById('saveBtn').addEventListener('click', saveState);
      document.getElementById('muteBtn').addEventListener('click', toggleMute);
      document.getElementById('ops101Btn').addEventListener('click', showOps101);
      document.getElementById('multiplayerBtn').addEventListener('click', renderMultiplayerPanel);
      document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
      document.getElementById('gameBoard').addEventListener('click', () => {
        if (state.selectedAssetId) {
          const asset = getAsset(state.selectedAssetId);
          const currentNode = getNode(asset.current);
          state.lastAdvisor = `Board selected. Asset ${asset.name} is currently at ${currentNode ? currentNode.name : 'a staging site'}. Click a node to reposition it or issue an action.`;
          renderAll();
        }
      });

      window.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') closeModal();
      });

      window.assignPersonnel = assignPersonnel;
      window.establishAirfield = establishAirfield;
      window.resupplyBase = resupplyBase;
      window.requestRFI = requestRFI;
      window.launchAirlift = launchAirlift;
      window.engageThreat = engageThreat;
      window.advanceTurn = advanceTurn;

      renderAll();
    </script>
  </body>
</html>
