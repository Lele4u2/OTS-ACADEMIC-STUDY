<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wolfpack OTS Mission Academy</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#192a42,#060c17 75%);color:#eef5ff;font:16px system-ui,Arial;min-height:100vh}main{max-width:900px;margin:auto;padding:24px}h1{font-size:clamp(28px,5vw,48px);margin:10px 0}h2{font-size:24px}.muted{color:#a9bdd8}.tag{color:#91ccff;letter-spacing:2px;font-size:13px;font-weight:800}.panel{border:1px solid #375378;border-radius:20px;background:#111d30ed;padding:22px;margin:18px 0;box-shadow:0 12px 35px #0005}.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}button{cursor:pointer;border:1px solid #4a719a;border-radius:12px;color:white;background:#1b3857;padding:15px;text-align:left;font:inherit}button:hover{background:#29547b}button:focus-visible{outline:3px solid #fcd66b}.choice{display:block;width:100%;margin:10px 0}.choice[disabled]{cursor:default;opacity:.85}.correct{border-color:#65e2a9;background:#145644!important}.wrong{border-color:#ff929c;background:#6b2633!important}.primary{background:#3870b0;font-weight:750}.small{font-size:13px}.stats{display:flex;flex-wrap:wrap;gap:14px}.stats span{padding:8px 12px;background:#172a43;border-radius:9px}.bar{height:9px;background:#2b3952;border-radius:99px;overflow:hidden}.bar div{height:100%;background:#79bfff;transition:width .2s}#feedback{line-height:1.5;padding:14px;border-left:3px solid #93c9fa;margin-top:12px;background:#12253b}#play{display:none}#finish{display:none}#menu{display:block}footer{margin:30px 0;color:#8c9db4;text-align:center}@media(max-width:540px){main{padding:14px}.panel{padding:15px}}
</style><main><div class="tag">FLIGHT 19 • WOLFPACK TRAINING</div><h1>🐺 OTS Mission Academy</h1><p class="muted">Learn the decisive clue. Pick the one BEST answer. Build confidence across key OTS subjects.</p>
<section id="menu" class="panel"><h2>Select a mission</h2><div class="modes">
<button onclick="start('mission')"><b>🎯 Operation Wolfpack</b><p class="small">12 questions. Three misses = mission failed.</p></button>
<button onclick="start('exam')"><b>📝 50-Question Exam</b><p class="small">50 randomized questions. Pass at 70%.</p></button>
<button onclick="start('rapid')"><b>⚡ Rapid Intel</b><p class="small">20 fast definition checks.</p></button>
<button onclick="start('recovery')"><b>🔁 Recovery Drill</b><p class="small">Review concepts you previously missed.</p></button></div>
<p id="saved" class="muted small"></p><button onclick="resetStats()" class="small">Clear saved practice history</button></section>
<section id="play" class="panel"><div class="stats"><span id="mode"></span><span id="count"></span><span id="score"></span><span id="miss"></span></div><p class="bar"><div id="progress"></div></p><div class="tag">SELECT THE BEST ANSWER</div><h2 id="question"></h2><div id="choices"></div><div id="feedback" hidden aria-live="polite"></div><p><button class="primary" id="next" onclick="advance()" hidden>Next Question →</button> <button onclick="home()">Exit to Menu</button></p></section>
<section id="finish" class="panel"><h2 id="result"></h2><p id="resultsText"></p><div id="weak"></div><button class="primary" onclick="home()">Back to Game Modes</button></section><footer>Study practice, not an official OTS assessment. Questions are original study items.</footer></main><script>
const bank=[["AFFORGEN reset","Recover, reconnect, reintegrate, and reconstitute","Validate advanced training","Execute missions","Conduct combat operations"],["AFFORGEN prepare","Build proficiency and readiness","Complete mission employment","Return home and recover","Certify deployed force"],["AFFORGEN ready","Certify and validate readiness","Restore after deployment","Initial qualification only","Deploy and execute"],["AFFORGEN commit","Employ forces or remain available to execute","Recover personnel","Start basic training","Rebuild equipment"],["SPAFORGEN","Predictable standardized battle rhythm","Four phases starting at Reset","Only wartime operations","A personnel promotion system"],["AFFORGEN design","Sustainable, capacity-driven model","Predictable standardized battle rhythm","Only satellite operations","One-time surge cycle"],["Readiness","Ability to fulfill mission requirements","Number of personnel assigned","Money allocated to a mission","How many plans were written"],["DIME: coercion by force","Military instrument","Diplomatic instrument","Informational instrument","Economic instrument"],["DIME: alliances","Diplomatic instrument","Military instrument","Economic instrument","Informational instrument"],["Air superiority","Freedom from attack and freedom to attack","Move cargo across the globe","Collect intelligence only","Hold surface targets at risk"],["Global precision attack","Hold targets at risk at chosen time with tactical, operational, strategic effects","Ensure all aircraft avoid weather","Move supplies across oceans","Provide diplomatic influence"],["Doctrine","Fundamental principles guiding military forces","Unchangeable detailed checklist","A temporary daily schedule","The commander's personal preference"],["Nature of war","Enduring character of conflict as violent clash of opposing wills","New technology changes warfare's nature","Only modern warfare is chaotic","War cannot be used for policy"],["Character of war","Ways war is fought change over time","War's underlying nature changes every year","War has no fog or friction","Politics never influences conflict"],["Friction in war","Small difficulties accumulate and impede plans","Perfect visibility of enemy actions","The predictable absence of chance","Automatic success of a plan"],["COA analysis / wargaming","Test likely action and enemy reaction and consequences","Select a COA before analysis","Only write the mission statement","Skip opponent actions"],["Red teaming","Challenge assumptions with alternative perspectives","Confirm the commander's first idea","Avoid questioning decisions","Choose the fastest option automatically"],["Critical thinking","Assess evidence, sources, assumptions and points of view","Accept first information heard","Follow rank over evidence","Pick the most popular idea"],["OODA loop","Observe, orient, decide, act and reassess","Only observe once","Act before understanding","Eliminate new information"],["Preventive discipline","Set clear standards before problems occur","Issue an LOR after misconduct","Complete court-martial procedures","Apply a punishment without guidance"],["Administrative discipline","Written reprimand or counseling after misconduct","Set expectations before misconduct","Train every new member","Conduct a team welcome brief"],["Yes-person follower","Agrees readily without independent critique","Questions respectfully with evidence","Withdraws while staying critical","Changes behavior only to survive"],["Alienated follower","Critical and independent but disengaged","Highly engaged independent thinker","Always agrees enthusiastically","Shifts views to survive"],["Survivor follower","Adapts behavior to reduce personal risk","Challenges all decisions openly","Commits proactively without concern","Always agrees without analysis"],["Connection core value","Build trust and meaningful collaboration","Avoid every tough conversation","Put speed over relationships","Work entirely alone"],["Character core value","Demonstrate integrity even when inconvenient","Choose personal convenience over standards","Hide a safety violation","Agree to avoid criticism"],["Commitment core value","Sustain dedication to mission and people","Abandon tasks at first difficulty","Focus solely on recognition","Avoid responsibility"],["Courage core value","Speak or act despite real risk to do what is right","Remain silent about a safety hazard","Avoid hard decisions","Follow a wrong order without question"],["Storming team stage","Coach through disagreement and conflict","Treat as fully independent performers","Only introduce members","Remove all differences of opinion"],["Forming team stage","Provide direction and clarity","Expect complete autonomy immediately","Only reward high performance","Ignore initial uncertainty"],["Norming team stage","Collaborate as roles and trust strengthen","Reintroduce basics every hour","Assume persistent conflict","Stop coordinating"],["Performing team stage","Empower effective independent performance","Provide constant detailed direction","Rebuild team identity from scratch","Require permission for every small step"],["Professional climate","Maintain physical and emotional safety","Accept harassment if output improves","Favor personal friends","Ignore reports of assault"],["Vision","Idealistic, shared, and achievable future","Only a description of today's problems","A list of daily tasks","A private unshared aspiration"],["Effective followership","Anticipate leader needs and bring evidence-based recommendations","Wait passively for each next instruction","Hide identified risks","Agree without thought"],["UCMJ purpose","Maintain good order and discipline","Replace all commander guidance","Determine aircraft maintenance plans","Manage satellite orbits"],["Airpower","Power projected in, from and through the air","Only operations from the ground","Only satellites in orbit","Only cargo aircraft"]];
const key='wolfpack_ots_practice_v1';let history={};try{history=JSON.parse(localStorage.getItem(key)||'{}')}catch{}
let mode='',deck=[],pos=0,correct=0,misses=0,submitted=false;
function shuffle(a){return a.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(x=>x[1])}
function save(){try{localStorage.setItem(key,JSON.stringify(history))}catch{}}
function resetStats(){if(confirm('Clear practice history on this browser?')){history={};save();home()}}
function home(){document.getElementById('menu').style.display='block';document.getElementById('play').style.display='none';document.getElementById('finish').style.display='none';let t=Object.values(history).reduce((s,x)=>s+x.seen,0);document.getElementById('saved').textContent=t+' questions practiced on this browser. Progress persists here.'}
function start(m){mode=m;correct=0;misses=0;pos=0;let ids=bank.map((x,i)=>i);if(m==='recovery'){ids=ids.filter(i=>history[i]?.wrong>0);if(!ids.length){alert('No missed concepts yet. Try another mode first.');return}}let n=m==='mission'?12:m==='rapid'?20:m==='exam'?50:Math.min(20,ids.length);let pool=shuffle(ids), chosen=[];while(chosen.length<n){if(!pool.length)pool=shuffle(ids);chosen.push(pool.pop())}deck=chosen;document.getElementById('menu').style.display='none';document.getElementById('finish').style.display='none';document.getElementById('play').style.display='block';render()}
function render(){submitted=false;document.getElementById('next').hidden=true;document.getElementById('feedback').hidden=true;let i=deck[pos],q=bank[i];document.getElementById('mode').textContent=({mission:'🎯 Mission',exam:'📝 Exam',rapid:'⚡ Rapid Intel',recovery:'🔁 Recovery'})[mode];document.getElementById('count').textContent='Question '+(pos+1)+' / '+deck.length;document.getElementById('score').textContent='Correct: '+correct;document.getElementById('miss').textContent='Misses: '+misses;document.getElementById('progress').style.width=(100*pos/deck.length)+'%';document.getElementById('question').textContent=q[0]+' — which option is the BEST match?';const opts=shuffle(q.slice(1).map((s,j)=>({s,good:j===0})));const c=document.getElementById('choices');c.innerHTML='';for(let j=0;j<opts.length;j++){let b=document.createElement('button');b.className='choice';b.textContent='ABCD'[j]+'. '+opts[j].s;b.onclick=()=>answer(b,opts[j],opts);b.dataset.good=opts[j].good;b.dataset.val=opts[j].s;c.appendChild(b)}}
function answer(button,opt){if(submitted)return;submitted=true;const i=deck[pos],q=bank[i];history[i]=history[i]||{seen:0,wrong:0};history[i].seen++;if(opt.good)correct++;else{misses++;history[i].wrong++}save();for(const b of document.querySelectorAll('.choice')){b.disabled=true;if(b.dataset.good==='true')b.classList.add('correct');else if(b===button)b.classList.add('wrong')}let f=document.getElementById('feedback');f.hidden=false;f.textContent=(opt.good?'✅ Correct. ':'❌ Not quite. ')+'Remember: '+q[1]+'. Look for this decisive clue when the question includes distracting details.';document.getElementById('score').textContent='Correct: '+correct;document.getElementById('miss').textContent='Misses: '+misses;const stop=mode==='mission'&&misses>=3;document.getElementById('next').textContent=stop||pos===deck.length-1?'View Results →':'Next Question →';document.getElementById('next').hidden=false}
function advance(){if(!submitted)return;if(pos===deck.length-1||mode==='mission'&&misses>=3){end();return}pos++;render()}
function end(){document.getElementById('play').style.display='none';document.getElementById('finish').style.display='block';let attempts=pos+1,percent=Math.round(correct/attempts*100),passed=mode==='mission'?misses<3&&attempts===deck.length:percent>=70;document.getElementById('result').textContent=passed?'🏆 Mission Accomplished!':'📘 Mission Debrief';document.getElementById('resultsText').textContent=correct+' / '+attempts+' correct ('+percent+'%). '+(mode==='mission'?'Mission rule: fewer than 3 mistakes.':'Practice target: 70% or higher.');let weak=Object.entries(history).filter(([i,v])=>v.wrong>0).sort((a,b)=>b[1].wrong-a[1].wrong).slice(0,6);document.getElementById('weak').innerHTML='<h3>Concepts to revisit</h3>'+(weak.length?weak.map(([i,v])=>'<p>• '+bank[i][0]+' — missed '+v.wrong+' time(s)</p>').join(''):'<p>No misses recorded yet!</p>');document.getElementById('progress').style.width='100%'}home();</script></html>
